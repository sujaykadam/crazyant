<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Langton's Ant</title>
<meta name="description" content="Interactive endless-grid Langton's ant visualizer with random starts and rewind. Built by Sujay Kadam.">
<meta name="author" content="Sujay Kadam">
<style>
  :root {
    --bg: #fafafa;
    --cell: #111;
    --grid: rgba(0, 0, 0, 0.08);
    --ant: #e5322d;
    --panel: rgba(255, 255, 255, 0.92);
    --text: #1a1a1a;
    --border: rgba(0, 0, 0, 0.15);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101114;
      --cell: #e8e8e8;
      --grid: rgba(255, 255, 255, 0.07);
      --ant: #ff5a52;
      --panel: rgba(28, 29, 33, 0.92);
      --text: #eee;
      --border: rgba(255, 255, 255, 0.18);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  #panel {
    position: fixed; left: 12px; right: 12px; bottom: 12px; max-width: 560px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; backdrop-filter: blur(6px);
    display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
  }
  button {
    font: inherit; color: inherit; background: transparent; border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 10px; cursor: pointer;
  }
  button:hover { background: var(--grid); }
  label { display: flex; align-items: center; gap: 6px; }
  input[type=range] { width: 120px; }
  button[aria-pressed=true] { background: var(--grid); border-color: var(--ant); }
  .timeline { flex: 1 1 100%; }
  .timeline input { flex: 1; width: auto; }
  #stats { margin-left: auto; font-variant-numeric: tabular-nums; opacity: 0.8; }
  .brand {
    flex: 1 1 100%; display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border-radius: 8px; font-size: 15px; color: #fff; text-decoration: none;
    background: #0a66c2; border: 1px solid #0a66c2;
  }
  .brand:hover { background: #0857a6; }
  .brand svg { width: 22px; height: 22px; fill: #fff; flex: none; }
  .brand .cta { margin-left: auto; font-size: 13px; opacity: 0.9; white-space: nowrap; }
  h1 { position: fixed; top: 10px; left: 14px; margin: 0; font-size: 15px; font-weight: 600; opacity: 0.8; pointer-events: none; }
</style>
</head>
<body>
<h1>Langton's Ant</h1>
<canvas id="c"></canvas>
<div id="panel">
  <a class="brand" href="https://www.linkedin.com/in/sujay-kadam/" target="_blank" rel="noopener noreferrer">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>
    <span>Built by <strong>Sujay Kadam</strong></span>
    <span class="cta">Connect on LinkedIn &rarr;</span>
  </a>
  <button id="play">Play</button>
  <button id="back">Back</button>
  <button id="step">Step</button>
  <button id="reverse" aria-pressed="false">Reverse</button>
  <button id="reset">Reset</button>
  <button id="random">Randomize</button>
  <label>Density <input id="density" type="range" min="0.05" max="0.95" step="0.05" value="0.3"></label>
  <label>Radius <input id="radius" type="range" min="5" max="300" step="5" value="50"><span id="radiusVal">50</span></label>
  <label>Speed <input id="speed" type="range" min="0" max="6" step="0.1" value="2"></label>
  <label><input id="follow" type="checkbox"> Follow</label>
  <label class="timeline">Timeline <input id="timeline" type="range" min="0" max="0" step="1" value="0"></label>
  <span id="stats"></span>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);

  // Endless grid: only black cells are stored, keyed by packed (x, y).
  const OFF = 1 << 25, SPAN = 1 << 26;
  const pack = (x, y) => (x + OFF) * SPAN + (y + OFF);

  // Directions: 0 up, 1 right, 2 down, 3 left (y grows downward).
  const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];

  let black, ax, ay, dir, steps;
  let maxSteps = 0;       // furthest step reached; the timeline spans 0..maxSteps
  let reverse = false;    // play direction
  // View: cell (0,0) top-left corner sits at (panX, panY) in CSS px.
  let scale = 10, panX = 0, panY = 0;
  let running = false, dirty = true, accumulator = 0;

  function reset() {
    black = new Set();
    ax = 0; ay = 0; dir = 0; steps = 0; maxSteps = 0;
    scale = 10;
    centerOn(0, 0);
    dirty = true;
  }

  // Fresh run on a random start: light cells within a circle of `radius` cells around the ant.
  function randomize() {
    reset();
    const p = +$('density').value;
    const r = +$('radius').value;
    for (let y = -r; y <= r; y++) {
      for (let x = -r; x <= r; x++) {
        if (x * x + y * y <= r * r && Math.random() < p) black.add(pack(x, y));
      }
    }
    // Zoom so the whole seeded area fits on screen.
    scale = Math.min(10, Math.max(0.5, Math.min(window.innerWidth, window.innerHeight) / (r * 2.4)));
    centerOn(0, 0);
    dirty = true;
  }

  function centerOn(cx, cy) {
    panX = window.innerWidth / 2 - (cx + 0.5) * scale;
    panY = window.innerHeight / 2 - (cy + 0.5) * scale;
  }

  function stepOnce() {
    const k = pack(ax, ay);
    if (black.has(k)) {
      dir = (dir + 3) & 3;
      black.delete(k);
    } else {
      dir = (dir + 1) & 3;
      black.add(k);
    }
    ax += DX[dir];
    ay += DY[dir];
    steps++;
  }

  // The ant is reversible: undo the move, then undo the flip and turn made at the cell it left.
  function stepBack() {
    const px = ax - DX[dir], py = ay - DY[dir];
    const k = pack(px, py);
    if (black.has(k)) {   // cell was white, ant turned right
      black.delete(k);
      dir = (dir + 3) & 3;
    } else {              // cell was black, ant turned left
      black.add(k);
      dir = (dir + 1) & 3;
    }
    ax = px; ay = py;
    steps--;
  }

  // Positive n steps forward, negative n steps back (stops at step 0).
  function advance(n) {
    if (n > 0) {
      for (let i = 0; i < n; i++) stepOnce();
      if (steps > maxSteps) maxSteps = steps;
    } else {
      for (let i = 0; i > n && steps > 0; i--) stepBack();
    }
    if ($('follow').checked) centerOn(ax, ay);
    dirty = true;
  }

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    dirty = true;
  }

  function css(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function draw() {
    const dpr = window.devicePixelRatio || 1;
    const w = window.innerWidth, h = window.innerHeight;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = css('--bg');
    ctx.fillRect(0, 0, w, h);

    if (scale >= 6) {
      ctx.strokeStyle = css('--grid');
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let x = ((panX % scale) + scale) % scale; x < w; x += scale) {
        ctx.moveTo(Math.round(x) + 0.5, 0); ctx.lineTo(Math.round(x) + 0.5, h);
      }
      for (let y = ((panY % scale) + scale) % scale; y < h; y += scale) {
        ctx.moveTo(0, Math.round(y) + 0.5); ctx.lineTo(w, Math.round(y) + 0.5);
      }
      ctx.stroke();
    }

    ctx.fillStyle = css('--cell');
    const size = Math.max(scale, 1);
    const pad = scale >= 6 ? 0.5 : 0;
    for (const k of black) {
      const x = Math.floor(k / SPAN) - OFF;
      const y = (k % SPAN) - OFF;
      const sx = panX + x * scale, sy = panY + y * scale;
      if (sx < -size || sy < -size || sx > w || sy > h) continue;
      ctx.fillRect(sx + pad, sy + pad, size - pad * 2, size - pad * 2);
    }

    // Ant: red square with a nose pointing in its heading.
    const s = Math.max(scale, 3);
    const cx = panX + (ax + 0.5) * scale, cy = panY + (ay + 0.5) * scale;
    ctx.fillStyle = css('--ant');
    ctx.fillRect(cx - s / 2, cy - s / 2, s, s);
    ctx.fillRect(cx + DX[dir] * s * 0.5 - s * 0.15, cy + DY[dir] * s * 0.5 - s * 0.15, s * 0.3, s * 0.3);

    $('timeline').max = maxSteps;
    $('timeline').value = steps;
    $('stats').textContent = `${steps.toLocaleString()} steps · ${black.size.toLocaleString()} black`;
  }

  function frame() {
    if (running) {
      // speed slider is log10 of steps per second.
      accumulator += Math.pow(10, +$('speed').value) / 60;
      const n = Math.floor(accumulator);
      accumulator -= n;
      if (n > 0) advance(reverse ? -n : n);
      if (reverse && steps === 0) setRunning(false);
    }
    if (dirty) { draw(); dirty = false; }
    requestAnimationFrame(frame);
  }

  function setRunning(r) {
    running = r;
    $('play').textContent = r ? 'Pause' : 'Play';
  }

  // Pan with drag.
  let drag = null;
  canvas.addEventListener('pointerdown', e => {
    drag = { x: e.clientX, y: e.clientY };
    canvas.setPointerCapture(e.pointerId);
    canvas.classList.add('dragging');
    $('follow').checked = false;
  });
  canvas.addEventListener('pointermove', e => {
    if (!drag) return;
    panX += e.clientX - drag.x;
    panY += e.clientY - drag.y;
    drag.x = e.clientX; drag.y = e.clientY;
    dirty = true;
  });
  const endDrag = () => { drag = null; canvas.classList.remove('dragging'); };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  // Zoom around the cursor.
  function zoomAt(px, py, factor) {
    const next = Math.min(80, Math.max(0.05, scale * factor));
    const f = next / scale;
    panX = px - (px - panX) * f;
    panY = py - (py - panY) * f;
    scale = next;
    dirty = true;
  }
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015));
  }, { passive: false });

  $('play').onclick = () => setRunning(!running);
  $('step').onclick = () => { setRunning(false); advance(1); };
  $('back').onclick = () => { setRunning(false); advance(-1); };
  $('reverse').onclick = () => {
    reverse = !reverse;
    $('reverse').setAttribute('aria-pressed', reverse);
  };
  $('timeline').oninput = () => {
    setRunning(false);
    advance(+$('timeline').value - steps);
  };
  $('reset').onclick = () => { setRunning(false); reset(); };
  $('radius').oninput = () => { $('radiusVal').textContent = $('radius').value; };
  $('random').onclick = () => { setRunning(false); randomize(); };
  $('follow').onchange = () => { if ($('follow').checked) { centerOn(ax, ay); dirty = true; } };
  window.addEventListener('resize', resize);
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); setRunning(!running); }
  });

  resize();
  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
